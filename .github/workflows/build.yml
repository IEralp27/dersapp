name: Derle
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux bağımlılıkları
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-libav gstreamer1.0-gl gstreamer1.0-pulseaudio
          # AppImage GStreamer'ı içine alır (tauri.conf.json bundleMediaFramework); ses/video çalma bunlara bağlı
      - run: npm ci
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: dersapp-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # Android taslağı: masaüstü matrisinden ayrı iş; burada hata olsa da masaüstü çıktıları etkilenmez.
  # Android projesi (src-tauri/gen/android) depoda tutulmaz, her seferinde `tauri android init` ile üretilir:
  # kilitli @tauri-apps/cli sürümünün şablonuyla her zaman uyumlu kalır, Gradle sarmalayıcı ikilileri depoya girmez.
  # Hata ayıklama (debug) APK'sı Gradle'ın hata ayıklama anahtarıyla imzalıdır: telefona doğrudan kurulur.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: android
      - name: Android SDK/NDK
        run: |
          # GitHub'ın Ubuntu makinesinde Android SDK ve NDK kurulu gelir (ANDROID_HOME, ANDROID_NDK_LATEST_HOME)
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" "$ANDROID_NDK_LATEST_HOME" | head -40
      - run: npm ci
      - name: Android projesini üret
        run: npx tauri android init --ci --skip-targets-install
      - name: APK derle (aarch64, debug)
        run: npx tauri android build --apk --debug --target aarch64 --ci
      - uses: actions/upload-artifact@v4
        with:
          name: dersapp-Android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
