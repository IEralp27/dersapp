[package]
name = "dersapp-mcp"
version = "0.1.0"
edition = "2021"
description = "DersApp için stdio MCP sunucusu (dosya kuyruğu köprüsü)"
publish = false

[[bin]]
name = "dersapp-mcp"
path = "src/main.rs"

[lib]
name = "dersapp_mcp"
path = "src/lib.rs"

[dependencies]
serde = "1"
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
