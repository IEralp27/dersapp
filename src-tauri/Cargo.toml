[package]
name = "ders-app"
version = "0.1.0"
description = "Ders çalışmak için PDF okuyucu"
authors = ["Eralp"]
edition = "2021"

[lib]
# `_lib` eki Windows'ta bin adıyla çakışmaması için gerekli
name = "ders_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable": sekme içindeki web sayfası için çoklu webview (Window::add_child)
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Piper indirmesi: ureq küçük, eşzamanlı bir HTTP istemcisi (async çalışma zamanı ve reqwest gerektirmez)
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
md-5 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
