[package]
name = "ders-app"
version = "0.1.0"
description = "Ders çalışmak için PDF okuyucu"
authors = ["Eralp"]
edition = "2021"

[lib]
# `_lib` eki Windows'ta bin adıyla çakışmaması için gerekli
name = "ders_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
